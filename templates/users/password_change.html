{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}修改密码 · 茶饮配方手册{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card auth-card border-0 shadow-sm">
                    <div class="card-body p-4 p-lg-5">
                        <p class="section-eyebrow mb-1">SECURITY</p>
                        <h1 class="section-title h4 mb-4">修改密码</h1>

                        <form method="post" novalidate>
                            {% csrf_token %}
                            {% bootstrap_form form %}
                            <div class="d-flex gap-2 mt-3">
                                <button class="btn btn-tea px-4" type="submit">确认修改</button>
                                <a class="btn btn-outline-secondary" href="{% url 'users:profile' %}">返回</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
